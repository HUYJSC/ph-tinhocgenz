version: '3.8'

services:
  # ─────────────────────────────────────────────
  # 1. POSTGRESQL DATABASE
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: phedu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phedu_production}
      POSTGRES_USER: ${POSTGRES_USER:-phedu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecuredPostgres@2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phedu_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # 2. REDIS CACHE & TASK QUEUE
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: phedu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ─────────────────────────────────────────────
  # 3. DJANGO BACKEND API (Gunicorn)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phedu_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:-django-insecure-prod-key-please-override-in-env}
      DEBUG: "False"
      DATABASE_URL: postgres://${POSTGRES_USER:-phedu_admin}:${POSTGRES_PASSWORD:-SecuredPostgres@2026!}@postgres:5432/${POSTGRES_DB:-phedu_production}
      ALLOWED_HOSTS: "localhost,127.0.0.1,hoctructuyen.tinhocgenz.io.vn,tinhocgenz.io.vn"
    ports:
      - "8000:8000"

volumes:
  pgdata:
    driver: local
