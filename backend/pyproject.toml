[project]
name = "ph-digital-education-backend"
version = "1.0.0"
description = "Python-first Backend & API for PH Digital Education LMS Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0.6",
    "djangorestframework>=3.15.1",
    "django-cors-headers>=4.3.1",
    "pydantic>=2.7.4",
    "argon2-cffi>=23.1.0",
    "drf-spectacular>=0.27.2",
    "python-dotenv>=1.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
