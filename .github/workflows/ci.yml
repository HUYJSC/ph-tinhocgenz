name: CI – Build · Type-check · Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. BUILD & VALIDATE (Frontend) ─────────────────────────────────────────
  build:
    name: 🏗️ Build & Validate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript – noEmit check
        run: npx tsc --noEmit

      - name: 🔨 Vite production build
        run: npm run build
        env:
          # Public (VITE_*) env vars needed at build time
          # Secrets are injected by Vercel at deploy time; here we use stubs
          # so the build can complete without real keys.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 📊 Report bundle sizes
        run: |
          echo "=== dist/ top-level ==="
          ls -lh dist/
          echo "=== dist/assets largest files ==="
          find dist/assets -type f | xargs ls -lhS 2>/dev/null | head -20

      - name: 🧪 Run JS tests
        run: npm test
        continue-on-error: true   # non-blocking until full test suite is ready

  # ── 2. BACKEND LINT & TEST (Django / Python) ────────────────────────────────
  backend:
    name: 🐍 Backend – Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install backend dependencies
        run: pip install -r requirements.txt

      - name: ✅ Django system checks
        run: python manage.py check --settings=config.settings.base
        continue-on-error: true   # non-blocking

      - name: 🧪 Run Django tests
        run: python manage.py test --settings=config.settings.base
        continue-on-error: true   # non-blocking until full test suite is ready

  # ── 3. SECURITY SCAN (lightweight) ──────────────────────────────────────────
  security:
    name: 🔒 Security – dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Install dependencies (CI)
        run: npm ci

      - name: 🔍 npm audit (high + critical only)
        run: npm audit --audit-level=high
        continue-on-error: true   # informational for now
