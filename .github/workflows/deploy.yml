name: Deploy to DirectAdmin via FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: 🚀 Deploy to Production (DirectAdmin)
    runs-on: ubuntu-latest
    environment: production   # Đọc secrets từ Environment "production"

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # Needed for changed-files detection by FTP-Deploy-Action

      # 2. Setup Node.js
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Generate Prisma Client
      - name: Generate Prisma Client
        run: npx prisma generate

      # 5. Run TypeScript type-check
      - name: TypeScript check
        run: npm run lint

      # 6. Build production assets
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      # 7. Deploy dist/ to DirectAdmin public_html via FTP
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: /public_html/
          # Chỉ upload file đã thay đổi so với lần deploy trước
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            !**/.env.example
