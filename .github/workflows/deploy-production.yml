name: 🏭 Production Deploy – Vercel

# Runs on every push to main / master.
# Vercel's own GitHub integration already handles production deploys,
# but this workflow gives you explicit control, release notes, and Slack/email hooks.

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # allow manual trigger from GitHub UI / CLI

concurrency:
  group: production-deploy
  cancel-in-progress: false   # never cancel a production deploy mid-flight

jobs:
  production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production   # requires manual approval if you set it in GitHub Settings

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      # ── Pre-deploy gate: TypeScript ──
      - name: 🔍 TypeScript check
        run: npx tsc --noEmit

      # ── Pre-deploy gate: Build ──
      - name: 🏗️ Verify production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── Deploy via Vercel CLI ──
      - name: 📦 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel deployment secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is not configured" >&2; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID is not configured" >&2; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID is not configured" >&2; exit 1; }

      - name: 🔗 Link Vercel project
        run: |
          mkdir -p .vercel
          cat << EOF > .vercel/project.json
          {
            "projectId": "${{ secrets.VERCEL_PROJECT_ID }}",
            "orgId": "${{ secrets.VERCEL_ORG_ID }}",
            "projectName": "eduquest-study-app"
          }
          EOF

      - name: 📥 Pull Vercel environment
        run: |
          echo "### 🔍 Vercel CLI Auth Check" >> $GITHUB_STEP_SUMMARY
          vercel whoami --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "### 📥 Vercel Pull Log" >> $GITHUB_STEP_SUMMARY
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --debug 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: 🏗️ Build Vercel artifacts
        run: |
          echo "### 🏗️ Vercel Build Log" >> $GITHUB_STEP_SUMMARY
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --debug 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: 🚀 Deploy to Vercel Production
        id: deploy
        run: |
          echo "### 🚀 Vercel Deploy Output" >> $GITHUB_STEP_SUMMARY
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz 2>&1 | tee -a $GITHUB_STEP_SUMMARY



      # ── Post-deploy summary ──
      - name: 📋 Deployment summary
        run: |
          echo "### ✅ Production deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ steps.deploy.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
